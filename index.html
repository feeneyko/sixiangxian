<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间管理四象限</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fafbf9'/%3E%3Cpath d='M16 5v22M5 16h22' stroke='%231c2b44' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='22.5' cy='9.5' r='3.6' fill='%23d42a3c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.1.0/style.css">
<style>
  :root {
    --paper: #fafbf9; --grid: rgba(58,110,180,.10); --card: #fff; --over: rgba(58,110,180,.08);
    --ink: #1c2b44; --muted: #647085; --line: #d6deea;
    --q1: #d42a3c; --q2: #1f58d6; --q3: #6b7079; --q4: #8a6400;
    --font: "LXGW WenKai Screen", "Kaiti SC", "STKaiti", "KaiTi", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1c2320; --grid: rgba(225,238,230,.05); --card: #232b28; --over: rgba(225,238,230,.06);
      --ink: #e7ede9; --muted: #8e9a93; --line: #36423d;
      --q1: #ff7b7b; --q2: #8fb5ff; --q3: #b0b7be; --q4: #f6d360;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; color: var(--ink); font-family: var(--font);
    background: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .page {
    max-width: 1300px; margin: 0 auto; padding: 28px 20px 48px;
    display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px 40px; align-items: start;
  }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
  h1 { margin: 0; font-weight: 400; font-size: 32px; }
  h2 { margin: 0 0 8px; font-weight: 400; font-size: 22px; }

  /* 坐标系：纵轴（y）= 重要，横轴（x）= 紧急 */
  .plane {
    --gap: 30px;
    position: relative; display: grid;
    grid-template-columns: 1fr 1fr; grid-template-rows: repeat(2, minmax(260px, 1fr));
    padding: 30px 0;
  }
  .x-axis, .y-axis { position: absolute; background: var(--ink); }
  .x-axis { left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; }
  .y-axis { top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; }
  .x-axis::after { content: ""; position: absolute; right: -2px; top: -5px; border-left: 12px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .y-axis::after { content: ""; position: absolute; top: -2px; left: -5px; border-bottom: 12px solid var(--ink); border-left: 6px solid transparent; border-right: 6px solid transparent; }
  .axis-label { position: absolute; font-size: 17px; }
  .axis-label.y { top: 2px; left: calc(50% + 14px); }
  .axis-label.x { right: 0; top: calc(50% + 6px); }

  .quad { min-width: 0; }
  .quad h2 { color: var(--qc); }
  .quad.over { background: var(--over); }
  .q1 { --qc: var(--q1); grid-area: 1 / 2; padding: 6px 6px var(--gap) var(--gap); }  /* 右上 */
  .q2 { --qc: var(--q2); grid-area: 1 / 1; padding: 6px var(--gap) var(--gap) 6px; }  /* 左上 */
  .q3 { --qc: var(--q3); grid-area: 2 / 1; padding: var(--gap) var(--gap) 6px 6px; }  /* 左下 */
  .q4 { --qc: var(--q4); grid-area: 2 / 2; padding: var(--gap) 6px 6px var(--gap); }  /* 右下 */

  /* 每一条 */
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: flex-start; gap: 6px; padding: 4px 0; }
  .grip {
    flex: none; width: 20px; height: 26px; margin: 0 -4px 0 -6px; padding: 4px 5px;
    background-image: radial-gradient(circle, var(--muted) 1.1px, transparent 1.5px);
    background-size: 5px 6px; background-origin: content-box; background-clip: content-box;
    cursor: grab; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; opacity: .6;
  }
  .grip:hover { opacity: 1; }
  li input[type=checkbox] { flex: none; width: 16px; height: 16px; margin: 5px 0 0; accent-color: var(--qc); }
  .body { flex: 1; min-width: 0; }
  .text { display: block; font-size: 17px; line-height: 1.5; overflow-wrap: anywhere; }
  .meta { display: block; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
  .meta:empty { display: none; }
  .left { margin-left: 8px; }
  .left.soon { color: var(--q1); }
  .done .text, .past .text { color: var(--muted); }
  .done .text { text-decoration: line-through; }
  .del { flex: none; border: 0; background: none; padding: 0 4px; color: var(--muted); font: inherit; font-size: 20px; line-height: 1.2; cursor: pointer; opacity: 0; }
  li:hover .del, .del:focus-visible { opacity: 1; }
  @media (hover: none) { .del { opacity: .6; } }

  /* 拖动时 */
  .placeholder { border: 1.5px dashed var(--muted); border-radius: 6px; background: var(--over); }
  .drag-src { display: none; }
  .ghost { position: fixed; left: 0; top: 0; z-index: 50; margin: 0; padding: 4px 6px; background: var(--card); border-radius: 6px; box-shadow: 0 10px 28px rgba(0,0,0,.2); pointer-events: none; }
  .ghost .del { opacity: 0; }
  body.dragging { cursor: grabbing; -webkit-user-select: none; user-select: none; }

  /* 输入 */
  .add {
    width: 100%; padding: 6px 2px;
    border: 0; border-bottom: 1.5px dashed var(--muted); border-radius: 0;
    background: transparent; color: var(--ink); font: inherit; font-size: 17px; outline: none;
  }
  .add::placeholder { color: var(--muted); }
  .add:focus { border-bottom-style: solid; border-bottom-color: var(--qc, var(--ink)); }
  .add-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .add-row .add { flex: 1; width: auto; min-width: 0; }
  .add-btn { flex: none; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--qc, var(--ink)); cursor: pointer; }
  .add-btn:hover { border-color: var(--qc, var(--ink)); }

  /* 日程 */
  .sched { position: sticky; top: 20px; padding: 16px 18px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  .sched h2 { font-size: 24px; }
  .sched li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .sched-add { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 8px 10px; align-items: end; margin-top: 10px; }
  .sched-add .add { grid-column: 1 / -1; }
  .sched-add label { display: grid; gap: 2px; min-width: 0; font-size: 12px; color: var(--muted); }
  .sched-add input[type=date], .sched-add input[type=time] {
    width: 100%; min-width: 0; min-height: 34px; padding: 5px 2px;
    border: 0; border-bottom: 1.5px solid var(--line); border-radius: 0;
    background: transparent; color: var(--ink); font: inherit; font-size: 16px;
    -webkit-appearance: none; appearance: none;
  }
  .sched-add input[type=date]:focus, .sched-add input[type=time]:focus { outline: none; border-bottom-color: var(--ink); }
  input::-webkit-date-and-time-value { text-align: left; }

  /* 云同步 */
  .sync-btn { border: 0; background: none; padding: 4px 0; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line); }
  .sync-btn.err { color: var(--q1); }
  .sync-panel { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  .sync-panel label { flex: 1 1 220px; display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
  .sync-panel input { padding: 6px 2px; border: 0; border-bottom: 1.5px solid var(--line); border-radius: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; outline: none; }
  .sync-panel input:focus { border-bottom-color: var(--ink); }
  .sync-panel button { padding: 6px 14px; border: 1px solid var(--ink); border-radius: 6px; background: var(--ink); color: var(--paper); font: inherit; font-size: 15px; cursor: pointer; }
  .sync-panel button.plain { background: transparent; color: var(--ink); border-color: var(--line); }
  .sync-panel p { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--muted); }
  .sync-panel p.err { color: var(--q1); }

  /* 手机 */
  @media (max-width: 760px) {
    .page { grid-template-columns: 1fr; padding: 20px 12px 40px; }
    .plane { --gap: 14px; grid-template-rows: repeat(2, minmax(190px, 1fr)); padding: 26px 0; }
    h2 { font-size: 18px; }
    .quad .text { font-size: 15px; }
    .add { font-size: 16px; }
    .sched { position: static; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>时间管理四象限</h1>
    <button class="sync-btn" id="syncBtn">未开启云同步</button>
  </header>

  <div class="sync-panel" id="syncPanel" hidden>
    <label>数据仓库（私有）<input id="repoInput" placeholder="用户名/sixiangxian-data" autocomplete="off" spellcheck="false"></label>
    <label>Token<input id="tokenInput" type="password" placeholder="github_pat_…" autocomplete="off"></label>
    <button id="connectBtn">连接</button>
    <button class="plain" id="disconnectBtn" hidden>断开</button>
    <p id="syncHint"></p>
  </div>

  <section class="plane">
    <div class="x-axis"></div>
    <div class="y-axis"></div>
    <span class="axis-label y">重要</span>
    <span class="axis-label x">紧急</span>
    <div class="quad q1" data-q="1"><h2>重要且紧急</h2><ul></ul><form class="add-row"><input class="add" placeholder="添加一项" enterkeyhint="done" autocomplete="off"><button type="submit" class="add-btn" aria-label="添加"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></form></div>
    <div class="quad q2" data-q="2"><h2>重要不紧急</h2><ul></ul><form class="add-row"><input class="add" placeholder="添加一项" enterkeyhint="done" autocomplete="off"><button type="submit" class="add-btn" aria-label="添加"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></form></div>
    <div class="quad q3" data-q="3"><h2>不重要不紧急</h2><ul></ul><form class="add-row"><input class="add" placeholder="添加一项" enterkeyhint="done" autocomplete="off"><button type="submit" class="add-btn" aria-label="添加"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></form></div>
    <div class="quad q4" data-q="4"><h2>不重要但紧急</h2><ul></ul><form class="add-row"><input class="add" placeholder="添加一项" enterkeyhint="done" autocomplete="off"><button type="submit" class="add-btn" aria-label="添加"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></form></div>
  </section>

  <aside class="sched">
    <h2>日程</h2>
    <ul id="sched"></ul>
    <form class="sched-add">
      <input class="add" placeholder="例如：看牙医" enterkeyhint="done" autocomplete="off">
      <label>日期<input type="date" class="add-date"></label>
      <label>时间<input type="time" class="add-time"></label>
      <button type="submit" class="add-btn" aria-label="添加"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
  </aside>
</div>

<script>
/* ================= 本地数据 ================= */
const KEY = 'sixiangxian:v2';
let data = { tasks: [], sched: [] };
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && Array.isArray(saved.tasks) && Array.isArray(saved.sched)) data = { tasks: saved.tasks, sched: saved.sched };
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clone = o => JSON.parse(JSON.stringify(o));

/* ================= 日期小工具 ================= */
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysFromToday = d => Math.round((dayStart(d) - dayStart(new Date())) / 864e5);  // 明天 = 1，昨天 = -1

// 「几天前添加」：新条目记录了 created；旧条目从 id 里读出创建时间
function addedText(t) {
  let ts = t.created;
  if (!ts) { const n = parseInt(String(t.id).slice(0, 8), 36); if (n > 1577836800000 && n < Date.now() + 864e5) ts = n; }
  if (!ts) return '';
  const n = -daysFromToday(new Date(ts));
  return n <= 0 ? '今天添加' : n === 1 ? '昨天添加' : `${n} 天前添加`;
}
// 日程：「9月25日 周五 10:00  还有 2 天」
function whenHTML(s) {
  if (!s.date) return '';
  const d = parseYmd(s.date), n = daysFromToday(d);
  const year = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '年' : '';
  const left = n === 0 ? '今天' : n === 1 ? '明天' : n > 1 ? `还有 ${n} 天` : `已过 ${-n} 天`;
  return `<span class="meta">${year}${d.getMonth() + 1}月${d.getDate()}日 周${WEEK[d.getDay()]}${s.time ? ' ' + s.time : ''}<span class="left${n === 0 || n === 1 ? ' soon' : ''}">${left}</span></span>`;
}

/* ================= 显示 ================= */
let drag = null, renderLater = false;
function render() {
  if (drag) { renderLater = true; return; }   // 拖动中先不刷新
  document.querySelectorAll('.quad').forEach(quad => {
    const q = Number(quad.dataset.q);
    quad.querySelector('ul').innerHTML = data.tasks.filter(t => t.q === q).map(t => `
      <li class="${t.done ? 'done' : ''}" data-id="${t.id}">
        <span class="grip" title="按住拖动"></span>
        <input type="checkbox"${t.done ? ' checked' : ''} aria-label="完成">
        <span class="body"><span class="text">${esc(t.text)}</span><span class="meta">${addedText(t)}</span></span>
        <button class="del" aria-label="删除">×</button>
      </li>`).join('');
  });
  $('sched').innerHTML = data.sched.map(s => `
    <li class="${s.date && daysFromToday(parseYmd(s.date)) < 0 ? 'past' : ''}" data-id="${s.id}">
      <span class="grip" title="按住拖动"></span>
      <span class="body"><span class="text">${esc(s.text)}</span>${whenHTML(s)}</span>
      <button class="del" aria-label="删除">×</button>
    </li>`).join('');
}

// 每次修改：先存本地，开了云同步的话 1.5 秒后上传
let edits = 0;
function changed() {
  edits++;
  save(); render();
  if (sync.token) { sync.dirty = true; saveSync(); schedulePush(); }
}

/* ================= 添加 / 删除 / 完成 ================= */
function addFrom(input) {
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  const quad = input.closest('.quad');
  if (quad) {
    data.tasks.push({ id: uid(), text, q: Number(quad.dataset.q), done: false, created: Date.now() });
  } else {
    const dateEl = input.form.querySelector('.add-date'), timeEl = input.form.querySelector('.add-time');
    let date = dateEl.value, time = timeEl.value.slice(0, 5);
    if (time && !date) date = ymd(new Date());          // 只选了时间：当作今天
    const item = { id: uid(), text, date, time };
    // 有日期的按时间插到合适的位置（之后也可以拖动调整）
    const key = x => x.date + ' ' + (x.time || '');
    const i = date ? data.sched.findIndex(x => x.date && key(x) > key(item)) : -1;
    if (i < 0) data.sched.push(item); else data.sched.splice(i, 0, item);
    dateEl.value = ''; timeEl.value = '';
  }
  input.value = '';
  changed();
}
// 电脑：按回车添加（输入法选字时按的回车不算）
document.addEventListener('keydown', e => {
  if (!e.target.classList.contains('add') || e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  addFrom(e.target);
});
// 手机键盘上的「完成 / 前往」键（备用）
document.addEventListener('submit', e => {
  e.preventDefault();
  const input = e.target.querySelector('.add');
  if (input) addFrom(input);
});
// 点 + 添加，点 × 删除
document.addEventListener('click', e => {
  const addBtn = e.target.closest('.add-btn');
  if (addBtn) { e.preventDefault(); addFrom(addBtn.form.querySelector('.add')); return; }
  if (!e.target.classList.contains('del')) return;
  const id = e.target.closest('li').dataset.id;
  data.tasks = data.tasks.filter(t => t.id !== id);
  data.sched = data.sched.filter(s => s.id !== id);
  changed();
});
// 打勾 = 完成
document.addEventListener('change', e => {
  if (e.target.type !== 'checkbox' || !e.target.closest('.quad')) return;
  const task = data.tasks.find(t => t.id === e.target.closest('li').dataset.id);
  if (task) { task.done = e.target.checked; changed(); }
});

/* ================= 拖动排序：按住左边的 ⋮⋮ 拖（电脑、手机都可以） ================= */
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip');
  if (!grip || e.button > 0) return;
  e.preventDefault();
  const li = grip.closest('li');
  drag = { li, id: li.dataset.id, isTask: !!li.closest('.quad'), pointerId: e.pointerId,
           x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, started: false, before: JSON.stringify(data) };
  try { document.body.setPointerCapture(e.pointerId); } catch (_) {}
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.started) {
    if (Math.hypot(drag.x - drag.x0, drag.y - drag.y0) < 4) return;
    startDrag();
  }
  e.preventDefault();
  moveDrag();
});
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

function startDrag() {
  const li = drag.li, r = li.getBoundingClientRect();
  drag.started = true;
  drag.dx = drag.x0 - r.left; drag.dy = drag.y0 - r.top;
  drag.ghost = li.cloneNode(true);
  drag.ghost.classList.add('ghost');
  drag.ghost.style.width = r.width + 'px';
  drag.ghost.style.setProperty('--qc', getComputedStyle(li).getPropertyValue('--qc'));
  document.body.appendChild(drag.ghost);
  drag.ph = document.createElement('li');
  drag.ph.className = 'placeholder';
  drag.ph.style.height = r.height + 'px';
  li.after(drag.ph);
  li.classList.add('drag-src');
  document.body.classList.add('dragging');
  requestAnimationFrame(autoScroll);
}
function moveDrag() {
  drag.ghost.style.transform = `translate(${drag.x - drag.dx}px, ${drag.y - drag.dy}px)`;
  const el = document.elementFromPoint(drag.x, drag.y);
  const zone = el && (drag.isTask ? el.closest('.quad') : el.closest('.sched'));   // 任务只能放进象限，日程只在日程里排
  document.querySelectorAll('.quad.over').forEach(q => { if (q !== zone) q.classList.remove('over'); });
  if (!zone) return;
  if (drag.isTask) zone.classList.add('over');
  const ul = zone.querySelector('ul');
  const items = [...ul.children].filter(x => x !== drag.ph && x !== drag.li);
  const before = items.find(x => { const r = x.getBoundingClientRect(); return drag.y < r.top + r.height / 2; }) || null;
  if (drag.ph.parentElement !== ul || drag.ph.nextElementSibling !== before) ul.insertBefore(drag.ph, before);
}
function autoScroll() {                              // 拖到屏幕上下边缘时自动滚动
  if (!drag || !drag.started) return;
  const edge = 70, h = window.innerHeight;
  const v = drag.y < edge ? -Math.ceil((edge - drag.y) / 5) : drag.y > h - edge ? Math.ceil((drag.y - h + edge) / 5) : 0;
  if (v) { window.scrollBy(0, v); moveDrag(); }
  requestAnimationFrame(autoScroll);
}
function endDrag(e) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const d = drag;
  drag = null;
  document.body.classList.remove('dragging');
  document.querySelectorAll('.quad.over').forEach(q => q.classList.remove('over'));
  if (!d.started) { if (renderLater) { renderLater = false; render(); } return; }
  d.ghost.remove();
  // 按占位框的位置得出新顺序
  const idAt = el => (el === d.ph ? d.id : el === d.li ? null : el.dataset.id);
  if (d.isTask) {
    const next = [];
    document.querySelectorAll('.quad').forEach(quad => {
      for (const el of quad.querySelector('ul').children) {
        const t = data.tasks.find(x => x.id === idAt(el));
        if (!t) continue;
        if (t.id === d.id) t.q = Number(quad.dataset.q);
        next.push(t);
      }
    });
    if (next.length === data.tasks.length) data.tasks = next;
  } else {
    const next = [...$('sched').children].map(el => data.sched.find(x => x.id === idAt(el))).filter(Boolean);
    if (next.length === data.sched.length) data.sched = next;
  }
  renderLater = false;
  if (JSON.stringify(data) !== d.before) changed(); else render();
}

// 过了午夜「还有几天 / 几天前」要跟着变
setInterval(render, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

/* ================= 云同步：数据存在你自己的 GitHub 私有仓库里 ================= */
const SYNC_KEY = 'sixiangxian:sync';
const FILE = 'data.json';
const EMPTY = { tasks: [], sched: [] };
const HINT = 'Token 只保存在这台设备的浏览器里，不会进到任何仓库。';
let sync = {};  // { repo, token, sha, base, dirty }
try { sync = JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) {}
function saveSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch (e) {} }

function showStatus(text, isError) {
  $('syncBtn').textContent = text;
  $('syncBtn').classList.toggle('err', !!isError);
  $('syncHint').textContent = isError ? (REASONS[lastError] || '连不上 GitHub，联网后会自动重试。') : HINT;
  $('syncHint').classList.toggle('err', !!isError);
}
const REASONS = {
  401: 'Token 不对或已过期，请重新生成一个再连接。',
  403: 'Token 没有写入权限：Contents 需要选 Read and write。',
  404: '找不到仓库：检查仓库名，以及 token 有没有选这个仓库。',
};
let lastError = '';

function gh(method, body) {
  return fetch(`https://api.github.com/repos/${sync.repo}/contents/${FILE}`, {
    method, cache: 'no-store',
    headers: { Authorization: `Bearer ${sync.token}`, Accept: 'application/vnd.github+json' },
    body: body ? JSON.stringify(body) : undefined,
  });
}
async function getRemote() {
  const r = await gh('GET');
  if (r.status === 404) return null;                  // 还没有数据文件
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  const bytes = Uint8Array.from(atob(j.content.replace(/\s/g, '')), c => c.charCodeAt(0));
  const d = JSON.parse(new TextDecoder().decode(bytes));
  return { sha: j.sha, data: { tasks: d.tasks || [], sched: d.sched || [] } };
}
async function putRemote(obj, sha) {
  let bin = '';
  new TextEncoder().encode(JSON.stringify(obj, null, 1)).forEach(b => { bin += String.fromCharCode(b); });
  const body = { message: '更新', content: btoa(bin) };
  if (sha) body.sha = sha;
  const r = await gh('PUT', body);
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).content.sha;
}

// 两台设备都改过时：把“这台设备上次同步后的改动”套到云端最新数据上
function mergeList(base, mine, theirs) {
  const before = new Map(base.map(x => [x.id, JSON.stringify(x)]));
  const mineIds = new Set(mine.map(x => x.id));
  const out = theirs.filter(x => !(before.has(x.id) && !mineIds.has(x.id)));   // 这台设备删掉的
  for (const x of mine) {
    const i = out.findIndex(y => y.id === x.id);
    if (!before.has(x.id)) { if (i < 0) out.push(x); }                          // 这台设备新加的
    else if (before.get(x.id) !== JSON.stringify(x) && i >= 0) out[i] = x;      // 这台设备改过的
  }
  return out;
}
const merge = (base, mine, theirs) => ({
  tasks: mergeList(base.tasks, mine.tasks, theirs.tasks),
  sched: mergeList(base.sched, mine.sched, theirs.sched),
});

let busy = false, timer = 0;
function schedulePush(ms = 1500) { clearTimeout(timer); timer = setTimeout(push, ms); }

// 上传
async function push() {
  if (!sync.token) return;
  if (busy) { schedulePush(); return; }
  busy = true;
  showStatus('同步中…');
  const startEdits = edits, mine = clone(data);
  try {
    let next, sha;
    for (let attempt = 1; ; attempt++) {
      const remote = await getRemote();
      next = remote && remote.sha !== sync.sha ? merge(sync.base || EMPTY, mine, remote.data) : mine;
      if (remote && JSON.stringify(next) === JSON.stringify(remote.data)) { sha = remote.sha; break; }  // 云端已经一样
      try { sha = await putRemote(next, remote && remote.sha); break; }
      catch (e) { if (attempt < 2 && (e.message === '409' || e.message === '422')) continue; throw e; }
    }
    const current = clone(data);
    const result = edits === startEdits ? next : merge(mine, current, next);   // 上传期间的新改动接着套上
    Object.assign(sync, { sha, base: next, dirty: edits !== startEdits });
    saveSync();
    if (JSON.stringify(result) !== JSON.stringify(current)) { data = result; save(); render(); }
    lastError = '';
    showStatus('已同步');
    if (sync.dirty) schedulePush();
  } catch (e) {
    lastError = e.message;
    showStatus('同步失败', true);
  }
  busy = false;
}

// 下载（打开页面、切回页面、每 30 秒）
async function pull() {
  if (!sync.token || busy || document.hidden) return;
  if (sync.dirty) { push(); return; }
  busy = true;
  try {
    const remote = await getRemote();
    busy = false;
    if (!remote) { push(); return; }                    // 云端还没数据：把这台设备的传上去
    if (remote.sha !== sync.sha && !sync.dirty) {
      Object.assign(sync, { sha: remote.sha, base: clone(remote.data) });
      saveSync();
      data = remote.data; save(); render();
    }
    lastError = '';
    showStatus('已同步');
  } catch (e) {
    busy = false;
    lastError = e.message;
    showStatus('同步失败', true);
  }
}

// 同步设置面板
$('repoInput').value = sync.repo || (location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] + '/sixiangxian-data' : '');
$('disconnectBtn').hidden = !sync.token;
$('syncBtn').addEventListener('click', () => { $('syncPanel').hidden = !$('syncPanel').hidden; });
$('connectBtn').addEventListener('click', async () => {
  const repo = $('repoInput').value.trim(), token = $('tokenInput').value.trim() || sync.token;
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { $('syncHint').textContent = '仓库名的格式是「用户名/仓库名」。'; $('syncHint').classList.add('err'); return; }
  if (!token) { $('syncHint').textContent = '请粘贴 token。'; $('syncHint').classList.add('err'); return; }
  sync = { repo, token, dirty: true };   // 第一次连接：把这台设备的数据和云端合并
  saveSync();
  $('tokenInput').value = '';
  $('disconnectBtn').hidden = false;
  await push();
  if (!lastError) $('syncPanel').hidden = true;
});
$('disconnectBtn').addEventListener('click', () => {
  sync = {};
  saveSync();
  $('disconnectBtn').hidden = true;
  showStatus('未开启云同步');
});
document.addEventListener('visibilitychange', () => {
  if (!sync.token) return;
  if (document.hidden) { if (sync.dirty) { clearTimeout(timer); push(); } }   // 切走前把没传完的传上去
  else pull();
});
window.addEventListener('online', () => pull());
setInterval(pull, 30000);

/* ================= 开始 ================= */
render();
showStatus(sync.token ? '同步中…' : '未开启云同步');
if (sync.token) sync.dirty ? push() : pull();
</script>
</body>
</html>
